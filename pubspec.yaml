name: baato_maps
description: "A Flutter package for Baato Maps. Baato Maps is a powerful and flexible mapping solution for Flutter applications."
version: 2.0.1
homepage: https://github.com/baato/flutter_baato_maps
license: MIT

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.26.2
  baato_api: ^2.2.0
  path_provider: ^2.1.6
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  assets:
    - lib/assets/markers/
    - lib/assets/map_res/sprites/
    - lib/assets/logo/
